name: Rehberleri Klasore Tasi (tek seferlik)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: html dosyalarini rehberler klasorune tasi
        run: |
          mkdir -p rehberler
          for f in *.html; do
            [ -e "$f" ] || continue
            [ "$f" = "index.html" ] && continue
            git mv "$f" rehberler/
          done
      - name: rehberler.json olustur
        run: |
          python3 - <<'PY'
          import json, glob, os
          files = sorted(
              [os.path.basename(f) for f in glob.glob('rehberler/*.html')],
              key=str.lower
          )
          with open('rehberler.json', 'w', encoding='utf-8') as fh:
              json.dump(files, fh, ensure_ascii=False, indent=2)
          PY
      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Rehber dosyalari rehberler klasorune tasindi"
          git push
