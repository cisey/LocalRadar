name: Rehber Listesini Güncelle

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.html'
      - '!index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: rehberler.json oluştur
        run: |
          python3 - <<'EOF'
          import json, os, glob
          files = sorted(
              [os.path.basename(f) for f in glob.glob('*.html')
               if os.path.basename(f).lower() != 'index.html'],
              key=str.lower
          )
          with open('rehberler.json', 'w', encoding='utf-8') as fh:
              json.dump(files, fh, ensure_ascii=False, indent=2)
          print(f"✅ {len(files)} rehber bulundu:", files)
          EOF

      - name: Değişiklik varsa commit et
        run: |
          if [ -n "$(git status --porcelain rehberler.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add rehberler.json
            git commit -m "🤖 rehberler.json otomatik güncellendi"
            git push
          else
            echo "Değişiklik yok, commit atlanıyor."
          fi
