name: Rehber Listesini Güncelle
on:
  push:
    branches: [ main, master ]
    paths:
      - 'rehberler/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rehberler.json oluştur
        run: |
          python3 - <<'PY'
          import json, glob, os
          files = sorted(
              [os.path.basename(f) for f in glob.glob('rehberler/*.html')],
              key=str.lower
          )
          with open('rehberler.json', 'w', encoding='utf-8') as fh:
              json.dump(files, fh, ensure_ascii=False, indent=2)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rehberler.json
          git diff --staged --quiet || git commit -m "rehberler.json otomatik güncellendi"
          git push
