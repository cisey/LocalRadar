<style>
:root {

*{box-sizing:border-box;margin:0;padding:0}

.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}

function km(a,b,c,d){const t=x=>x*Math.PI/180,R=6371,dl=t(c-a),dg=t(d-b);
