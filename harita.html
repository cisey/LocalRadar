<style>
:root{--bg:#0b0f17;--card:#141b29;--line:rgba(255,255,255,.1);--text:#f8fafc;--muted:#94a3b8;--accent:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.kap{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
a.geri{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;display:inline-block;margin-bottom:6px}
h1{font-size:20px;font-weight:800}
.alt{color:var(--muted);font-size:13px;margin:4px 2px 10px}
.harita{position:relative;background:#0e1420;border:1px solid var(--line);border-radius:16px;overflow:hidden}
svg{width:100%;height:46vh;min-height:210px;max-height:560px;display:block;touch-action:none;cursor:grab}
svg path{fill:#1b2434;stroke:#0b0f17;stroke-width:.25;vector-effect:non-scaling-stroke;stroke-width:.7px}
svg path.dolu{fill:#1f5f86}
svg path.il{stroke:#38bdf8;stroke-opacity:.5}
svg path.sec{fill:#38bdf8}
svg path.dolu.il{fill:#2a7cae}
svg path.sec.dolu{fill:#7dd3fc}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:rgba(20,27,41,.92);color:var(--text);font-size:20px;line-height:1}
.zoom button.kucuk{font-size:13px}
.ipucu{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:8px 2px 0;flex-wrap:wrap}
.ipucu i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.panel{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:none}
.panel.acik{display:block;border-color:rgba(56,189,248,.45)}
.panel h2{font-size:17px;margin-bottom:10px}
a.tum,a.ilce{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:#fff;font-weight:700;font-size:15px;padding:13px 14px;border-radius:12px;margin-bottom:10px}
a.tum{background:linear-gradient(135deg,rgba(56,189,248,.25),rgba(99,102,241,.25));border:1px solid rgba(56,189,248,.4)}
a.ilce{background:#1f5f86;border:1px solid rgba(125,211,252,.5)}
.et{font-size:11px;letter-spacing:.06em;color:var(--muted);margin:2px 2px 7px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{text-decoration:none;color:var(--text);font-size:14px;padding:9px 14px;border-radius:999px;background:#1b2434;border:1px solid var(--line)}
.chips a.bu{border-color:#7dd3fc}
.bilgi{color:var(--muted);font-size:14px;margin:4px 2px 10px}
.arac{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.arac button{flex:1;min-width:140px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#141b29;color:var(--text);font-size:14px;font-weight:600}
.arac button.on{background:#1f5f86;border-color:#7dd3fc}
.seg{display:flex;flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:#141b29;min-width:0}
.seg button.on{background:#1f5f86}
svg.solo path:not(.dolu){opacity:.3}
circle.ben{fill:#f43f5e;stroke:#fff;stroke-width:.6px;vector-effect:non-scaling-stroke}
.ozet{margin:2px 0 12px}
.yer{display:flex;justify-content:space-between;gap:10px;align-items:center;text-decoration:none;color:var(--text);padding:10px 12px;border-radius:12px;background:#1b2434;border:1px solid var(--line);margin-bottom:6px;font-size:14px}
.yer b{font-weight:600}.yer small{color:var(--muted);display:block;margin-top:2px;font-size:12px}
.yer .km{color:#7dd3fc;font-weight:700;white-space:nowrap}
a.gm{display:block;text-align:center;text-decoration:none;color:var(--text);padding:11px;border-radius:12px;border:1px solid var(--line);font-size:14px;margin:8px 0}
.chipbtn{background:#1b2434;border:1px solid #7dd3fc;color:var(--text);border-radius:999px;padding:6px 12px;font-size:13px}
.sec-kutu{width:100%;margin-top:10px;padding:12px;border-radius:12px;background:#141b29;color:var(--text);border:1px solid var(--line);font-size:15px}
</style>

function sinirla() {
  vb[2] = Math.min(Math.max(vb[2], TAM[2] / 40), TAM[2]); vb[3] = vb[2] * TAM[3] / TAM[2];
}
function yakinlas(oran, mx, my) {            // mx,my: svg birimi cinsinden sabit nokta
  const yw = vb[2] / oran, yh = vb[3] / oran;
  vb[0] = mx - (mx - vb[0]) * (yw / vb[2]); vb[1] = my - (my - vb[1]) * (yh / vb[3]);
  vb[2] = yw; vb[3] = yh; sinirla(); vbUygula();
}
function ekranToSvg(cx, cy) {
  const r = svg.getBoundingClientRect(); const olcek = Math.min(r.width / vb[2], r.height / vb[3]);
  const ox = (r.width - vb[2] * olcek) / 2, oy = (r.height - vb[3] * olcek) / 2;
  return [vb[0] + (cx - r.left - ox) / olcek, vb[1] + (cy - r.top - oy) / olcek, olcek];
}
function ilaYaklas(il) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  yollar.filter(y => y.il === il).forEach(y => {
    const b = y.el.getBBox(); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
  });
  if (x0 > 1e8) return;
  const r = svg.getBoundingClientRect(); const en = r.width / Math.max(r.height, 1);
  let w = (x1 - x0) * 1.3, h = (y1 - y0) * 1.3;
  if (w / h < en) w = h * en; else h = w / en;
  vb = [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h]; vbUygula();
}

function ciz() {
  svg.innerHTML = '';
  GEO.d.forEach(([il, ilce, d]) => {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d); p.setAttribute('fill-rule', 'evenodd');
    const dosya = ilceDosya[il + '|' + normalize(ilce)];
    if (dosya) p.setAttribute('class', 'dolu');
    p.innerHTML = '<title>' + (ilce === 'Merkez' ? il + ' Merkez' : ilce + ' (' + il + ')') + '</title>';
    p.addEventListener('click', e => { if (surukleme) return; sec(il, ilce, p); });
    svg.appendChild(p);
    yollar.push({el: p, il, ilce});
  });
}

function sec(il, ilce, yol) {
  if (konumKey !== il + '|' + ilce) konumKey = null;
  yollar.forEach(y => y.el.classList.remove('sec', 'il'));
  yollar.filter(y => y.il === il).forEach(y => y.el.classList.add('il'));
  if (yol) yol.classList.add('sec');
  seciliIl = il;
  ilaYaklas(il);
  panelAc(il, ilce);
}

let userPos = null, konumKey = null, panelJeton = 0;
const rehberCache = {};
function rehberVerisi(dosya) {
  if (!rehberCache[dosya]) {
    rehberCache[dosya] = fetch(yolu(dosya)).then(r => r.text()).then(t => {
      const i = t.indexOf('const V='), j = t.indexOf(',O=V.O', i);
      if (i < 0 || j < 0) throw new Error('veri yok');
      return JSON.parse(t.slice(i + 8, j)).I || [];
    });
  }
  return rehberCache[dosya];
}
function km(la1, lo1, la2, lo2) {
  const R = 6371, r = Math.PI / 180, dLa = (la2 - la1) * r, dLo = (lo2 - lo1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
const puanSayi = x => parseFloat(String(x.p).replace(',', '.')) || 0;
function yerKarti(x, mesafe) {
  return '<a class="yer" href="' + esc(x.l) + '" target="_blank" rel="noopener"><span><b>' + esc(x.n) + '</b><small>★ ' + esc(x.p) + ' · ' + x.y + ' yorum' + (x.t ? ' · ' + esc(x.t) : '') + '</small></span>' +
    (mesafe != null ? '<span class="km">' + (mesafe < 1 ? Math.round(mesafe * 1000) + ' m' : mesafe.toFixed(1) + ' km') + '</span>' : '<span>↗</span>') + '</a>';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }

function ozetDoldur(il, ilce, dosya, jeton) {
  const kutu = document.getElementById('ozet');
  rehberVerisi(dosya).then(liste => {
    if (jeton !== panelJeton || !kutu) return;
    const yemek = liste.filter(x => x.A === 'Yemek' && !x.u);
    let h = '<div class="et">' + yemek.length + ' YEMEK YERİ</div>';
    const buradayim = userPos && konumKey === il + '|' + ilce;
    if (buradayim) {
      const yakin = yemek.filter(x => x.e != null && x.b != null && puanSayi(x) >= 4 && x.y >= 100)
        .map(x => [x, km(userPos.lat, userPos.lon, x.e, x.b)]).sort((a, b) => a[1] - b[1]).slice(0, 5);
      h += '<div class="et" style="color:#7dd3fc">YAKINIMDAKİ İYİ YERLER (4,0+ puan, 100+ yorum)</div>';
      h += yakin.length ? yakin.map(([x, d]) => yerKarti(x, d)).join('') : '<p class="bilgi">Bu ilçede yakınında şartlara uyan yer bulunamadı.</p>';
    } else {
      const ust = yemek.slice().sort((a, b) => (b.s || 0) - (a.s || 0)).slice(0, 3);
      h += '<div class="et" style="color:#7dd3fc">EN GÜVENİLİR 3 YER</div>' + ust.map(x => yerKarti(x)).join('');
    }
    kutu.innerHTML = h;
  }).catch(() => { if (kutu) kutu.innerHTML = '<p class="bilgi">Özet yüklenemedi, rehberi açabilirsin.</p>'; });
}

function enYakinRehberli(x, y) {
  let en = null, ed = 1e18;
  yollar.forEach(p => {
    if (!p.el.classList.contains('dolu')) return;
    const bb = p.el.getBBox(), d = (bb.x + bb.width / 2 - x) ** 2 + (bb.y + bb.height / 2 - y) ** 2;
    if (d < ed) { ed = d; en = p; }
  });
  return en;
}

function panelAc(il, ilce) {
  const v = ilDosyalari[il];
  const jeton = ++panelJeton;
  panel.className = 'panel acik';
  let h = '<h2>' + il + (ilce ? ' · ' + (ilce === 'Merkez' ? 'Merkez' : ilce) : '') + '</h2>';
  let dosya = null;
  if (ilce) {
    dosya = ilceDosya[il + '|' + normalize(ilce)];
    const ad = ilce === 'Merkez' ? il + ' Merkez' : ilce;
    h += dosya ? '<a class="ilce" href="' + yolu(dosya) + '">📍 ' + ad + ' rehberi <span>→</span></a><div class="ozet" id="ozet"><p class="bilgi">Özet yükleniyor…</p></div>'
               : '<p class="bilgi">Bu ilçe henüz taranmadı.</p>';
    h += '<a class="gm" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('restoran ' + ad + ' ' + (ilce === 'Merkez' ? '' : il)) + '">🔎 Google Haritalar\'da yemek yerlerine bak</a>';
    if (!dosya && konumKey === il + '|' + ilce && userPos) {
      const bb = yollar.find(y => y.il === il && y.ilce === ilce).el.getBBox();
      const en = enYakinRehberli(bb.x + bb.width / 2, bb.y + bb.height / 2);
      if (en) h += '<p class="bilgi">En yakın rehberli ilçe: <button class="chipbtn" id="enyakin">' + (en.ilce === 'Merkez' ? en.il + ' Merkez' : en.ilce + ' (' + en.il + ')') + '</button></p>';
      window._en = en;
    }
  }
  if (v && v.tum) h += '<a class="tum" href="' + yolu(v.tum) + '">📚 ' + il + ' · Tüm İlçeler <span>→</span></a>';
  if (v && v.ilceler.length) {
    h += '<div class="et">' + il.toLocaleUpperCase('tr') + ' İLÇELERİ</div><div class="chips">' +
      v.ilceler.map(x => '<a class="' + (ilce && normalize(x.label) === normalize(ilce) ? 'bu' : '') + '" href="' + yolu(x.dosya) + '">' + x.label + '</a>').join('') + '</div>';
  } else if (!ilce) {
    h += '<p class="bilgi">Bu il için henüz rehber yok.</p>';
  }
  panel.innerHTML = h;
  const eb = document.getElementById('enyakin');
  if (eb) eb.onclick = () => { const en = window._en; if (en) sec(en.il, en.ilce, en.el); };
  if (dosya) ozetDoldur(il, ilce, dosya, jeton);
  panel.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function konumBul() {
  const bt = document.getElementById('konum');
  if (!navigator.geolocation) { panel.className = 'panel acik'; panel.innerHTML = '<p class="bilgi">Bu tarayıcı konum özelliğini desteklemiyor.</p>'; return; }
  bt.textContent = '📍 Konum aranıyor…';
  navigator.geolocation.getCurrentPosition(pos => {
    bt.textContent = '📍 Konumumu bul';
    userPos = {lat: pos.coords.latitude, lon: pos.coords.longitude};
    const C = Math.cos(39 * Math.PI / 180), x = (userPos.lon - 25.5) * C * 60, y = (42.3 - userPos.lat) * 60;
    const nokta = svg.createSVGPoint(); nokta.x = x; nokta.y = y;
    svg.querySelectorAll('circle.ben').forEach(c => c.remove());
    const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', 'ben'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 1.4); svg.appendChild(c);
    const bulunan = yollar.find(p => p.el.isPointInFill(nokta));
    if (!bulunan) { panel.className = 'panel acik'; panel.innerHTML = '<p class="bilgi">Bulunduğun yer harita sınırlarında bulunamadı.</p>'; return; }
    konumKey = bulunan.il + '|' + bulunan.ilce;
    sec(bulunan.il, bulunan.ilce, bulunan.el);
  }, err => {
    bt.textContent = '📍 Konumumu bul';
    panel.className = 'panel acik';
    panel.innerHTML = '<p class="bilgi">Konum alınamadı. Tarayıcının konum iznini açıp tekrar dene.</p>';
  }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
}
document.getElementById('konum').onclick = konumBul;
document.getElementById('m-hepsi').onclick = () => { svg.classList.remove('solo'); document.getElementById('m-hepsi').classList.add('on'); document.getElementById('m-rehber').classList.remove('on'); };
document.getElementById('m-rehber').onclick = () => { svg.classList.add('solo'); document.getElementById('m-rehber').classList.add('on'); document.getElementById('m-hepsi').classList.remove('on'); };

// ---- kaydırma ve yakınlaştırma ----
let surukleme = false;
const isaretler = new Map();
let basla = null, pinch0 = null;
svg.addEventListener('pointerdown', e => {
  isaretler.set(e.pointerId, [e.clientX, e.clientY]);
  basla = {x: e.clientX, y: e.clientY, vb: vb.slice()}; surukleme = false;
  if (isaretler.size === 2) { const [a, b] = [...isaretler.values()]; pinch0 = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), vb: vb.slice()}; }
});
svg.addEventListener('pointermove', e => {
  if (!isaretler.has(e.pointerId)) return;
  isaretler.set(e.pointerId, [e.clientX, e.clientY]);
  if (isaretler.size === 2 && pinch0) {
    const [a, b] = [...isaretler.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    const mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
    vb = pinch0.vb.slice(); const [sx, sy] = ekranToSvg(mx, my);
    yakinlas(d / pinch0.d, sx, sy); surukleme = true; return;
  }
  if (isaretler.size === 1 && basla) {
    const dx = e.clientX - basla.x, dy = e.clientY - basla.y;
    if (!surukleme && Math.hypot(dx, dy) < 7) return;
    surukleme = true;
    const r = svg.getBoundingClientRect(); const olcek = Math.min(r.width / basla.vb[2], r.height / basla.vb[3]);
    vb[0] = basla.vb[0] - dx / olcek; vb[1] = basla.vb[1] - dy / olcek; vbUygula();
  }
});
function bitir(e) { isaretler.delete(e.pointerId); pinch0 = null; if (isaretler.size === 0) setTimeout(() => { surukleme = false; }, 30); else { const [k] = isaretler.values(); basla = {x: k[0], y: k[1], vb: vb.slice()}; } }
svg.addEventListener('pointerup', bitir); svg.addEventListener('pointercancel', bitir); svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') bitir(e); });
svg.addEventListener('wheel', e => { e.preventDefault(); const [sx, sy] = ekranToSvg(e.clientX, e.clientY); yakinlas(e.deltaY < 0 ? 1.25 : 0.8, sx, sy); }, {passive: false});
function merkezdenYakinlas(o) { yakinlas(o, vb[0] + vb[2] / 2, vb[1] + vb[3] / 2); }
document.getElementById('zi').onclick = () => merkezdenYakinlas(1.5);
document.getElementById('zo').onclick = () => merkezdenYakinlas(1 / 1.5);
document.getElementById('zr').onclick = () => { vb = TAM.slice(); vbUygula(); };

function listeyiYukle(dosyalar) {
  dosyalar.filter(f => /\.html?$/i.test(f) && !/^(index|harita)\.html?$/i.test(f))
    .sort((a, b) => a.localeCompare(b, 'tr'))
    .forEach(f => {
      const r = dosyaAnaliz(f);
      if (r.il === 'Diğer') return;
      const v = ilDosyalari[r.il] || (ilDosyalari[r.il] = {tum: null, ilceler: []});
      if (r.tum) v.tum = f; else { v.ilceler.push(r); ilceDosya[r.il + '|' + normalize(r.label)] = f; }
    });
  Object.values(ilDosyalari).forEach(v => v.ilceler.sort((a, b) => a.label.localeCompare(b.label, 'tr')));
  ciz(); vbUygula();
  const kutu = document.getElementById('ilSec');
  Object.keys(ilDosyalari).sort((a, b) => a.localeCompare(b, 'tr')).forEach(il => {
    const o = document.createElement('option'); o.value = il; o.textContent = il; kutu.appendChild(o);
  });
  kutu.addEventListener('change', () => {
    if (!kutu.value) return;
    yollar.forEach(y => y.el.classList.remove('sec', 'il'));
    yollar.filter(y => y.il === kutu.value).forEach(y => y.el.classList.add('il'));
    ilaYaklas(kutu.value); panelAc(kutu.value, null);
  });
}

vbUygula();
fetch('rehberler.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('json yok'); return r.json(); })
  .then(data => {
    const d = Array.isArray(data) ? data.map(x => typeof x === 'string' ? x : (x.file || x.name))
      : (data && Array.isArray(data.files) ? data.files : Object.keys(data || {}));
    listeyiYukle(d.filter(Boolean));
  })
  .catch(() => {
    fetch('https://api.github.com/repos/cisey/LocalRadar/contents/rehberler')
      .then(r => { if (!r.ok) throw new Error('api'); return r.json(); })
      .then(d => listeyiYukle(d.map(f => f.name)))
      .catch(() => { panel.className = 'panel acik'; panel.innerHTML = '<p class="bilgi">Rehber listesi yüklenemedi.</p>'; });
  });
</script>
