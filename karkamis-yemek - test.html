<style>
:root {
  --bg: #f1f5f9;
  --bg-glass: rgba(241, 245, 249, 0.92);
  --card: #ffffff;
  --ink: #0f172a;
  --mut: #64748b;
  --line: #e2e8f0;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primarybg: #eff6ff;
  --gold: #d97706;
  --goldbg: #fef3c7;
  --yesil: #059669;
  --yesilbg: #ecfdf5;
  --danger: #dc2626;
  --dangerbg: #fef2f2;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --bg-glass: rgba(15, 23, 42, 0.92);
    --card: #1e293b;
    --ink: #f8fafc;
    --mut: #94a3b8;
    --line: #334155;
    --primary: #3b82f6;
    --primary-hover: #60a5fa;
    --primarybg: rgba(59, 130, 246, 0.15);
    --gold: #f59e0b;
    --goldbg: rgba(245, 158, 11, 0.15);
    --yesil: #10b981;
    --yesilbg: rgba(16, 185, 129, 0.15);
    --danger: #ef4444;
    --dangerbg: rgba(239, 68, 68, 0.15);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 14px 12px 48px;
}

/* ── KOMPAKT ÜST BAŞLIK ── */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 16px;
  margin-bottom: 10px;
}

.title-area h1 {
  font-size: 20px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.02em;
}

.title-area .sub {
  font-size: 12px;
  color: var(--mut);
  margin: 2px 0 0;
}

.header-badges {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.act-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 8px;
  padding: 5px 10px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}

.act-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.act-btn.danger {
  color: var(--danger);
}

.act-btn.danger:hover {
  background: var(--dangerbg);
  border-color: var(--danger);
}

/* ── KOMPAKT FİLTRE KARTI ── */
.filter-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  margin-bottom: 10px;
}

input, select {
  width: 100%;
  font: inherit;
  font-size: 13px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg);
  color: var(--ink);
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  background: var(--card);
}

.f-row-compact {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.f-row-mahalle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
}

.f-label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--mut);
  margin: 0 0 3px 2px;
  font-weight: 700;
}

/* ── TÜMÜNÜ GÖSTEREN KATEGORİ SEKMELERİ (KAYDIRMASIZ / WRAP) ── */
.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap; /* Sağa kaydırmayı kaldırır, hepsi ekranda görünür */
  position: sticky;
  top: 0;
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 8px 0;
  z-index: 500;
  border-bottom: 1px solid var(--line);
  margin-bottom: 6px;
}

.tabs button {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.15s;
}

.tabs button:hover {
  border-color: var(--primary);
}

.tabs button[aria-selected="true"] {
  background: var(--primary);
  border-color: var(--primary);
  color: #ffffff;
}

.chips {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  padding: 4px 0 8px;
}

.chips button {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--mut);
  font: inherit;
  font-size: 12px;
  padding: 4px 11px;
  border-radius: 99px;
  cursor: pointer;
}

.chips button[aria-pressed="true"] {
  background: var(--primarybg);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 700;
}

/* ── BÖLÜM BAŞLIKLARI ── */
h2 {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14.5px;
  margin: 16px 0 8px;
  font-weight: 800;
  color: var(--ink);
}

h2 .count-pill {
  font-size: 11px;
  font-weight: 700;
  background: var(--primarybg);
  color: var(--primary);
  padding: 1px 7px;
  border-radius: 99px;
}

/* ── KOMPAKT MEKAN LİSTESİ (TEK BAKIŞTA ÇOK MEKAN) ── */
.cards-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 9px 12px;
  transition: border-color 0.15s;
}

.row:hover {
  border-color: var(--primary);
}

/* Kompakt Puan Rozeti */
.pt {
  flex: 0 0 46px;
  text-align: center;
  border-radius: 9px;
  padding: 5px 2px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  border: 1px solid transparent;
}

.pt.tier-high { background: var(--yesilbg); color: var(--yesil); border-color: rgba(5, 150, 105, 0.2); }
.pt.tier-mid  { background: var(--primarybg); color: var(--primary); border-color: rgba(37, 99, 235, 0.2); }
.pt.tier-low  { background: var(--goldbg); color: var(--gold); border-color: rgba(217, 119, 6, 0.2); }
.pt.tier-none { background: var(--bg); color: var(--mut); border-color: var(--line); }

.pt b {
  display: block;
  font-size: 14.5px;
  font-weight: 800;
  line-height: 1.1;
}

.pt small {
  font-size: 10px;
  font-weight: 600;
  opacity: 0.85;
  margin-top: 2px;
}

.body {
  flex: 1;
  min-width: 0;
}

.nm {
  font-weight: 700;
  font-size: 14.5px;
  color: var(--ink);
  overflow-wrap: anywhere;
}

.meta-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  margin-top: 3px;
  font-size: 12px;
  color: var(--mut);
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 6px;
  background: var(--bg);
  color: var(--mut);
}

.tag.mah-tag { background: var(--primarybg); color: var(--primary); }
.tag.dist-tag { background: var(--yesilbg); color: var(--yesil); }
.tag.fy-tag { background: var(--goldbg); color: var(--gold); }

/* Sağdaki Hızlı Butonlar */
.side-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

a.go {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: #ffffff;
  background: var(--primary);
  text-decoration: none;
  padding: 6px 11px;
  border-radius: 8px;
  white-space: nowrap;
}

a.go:hover {
  background: var(--primary-hover);
}

.ikon {
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--mut);
  border-radius: 8px;
  width: 31px;
  height: 31px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  cursor: pointer;
  padding: 0;
}

.ikon:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.ikon.fav-active {
  background: var(--goldbg);
  border-color: var(--gold);
  color: var(--gold);
}

.foot {
  text-align: center;
  color: var(--mut);
  font-size: 11.5px;
  margin-top: 28px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.none {
  text-align: center;
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 12px;
  color: var(--mut);
  padding: 24px 16px;
  font-size: 13px;
}

#map {
  display: none;
  height: 65vh;
  border-radius: 14px;
  border: 1px solid var(--line);
  margin-top: 8px;
}

@media (max-width: 600px) {
  .f-row-compact { grid-template-columns: 1fr 1fr; }
  .row { padding: 8px 10px; }
  a.go span.go-txt { display: none; } /* Telefonda harita butonu daha az yer kaplar */
}
</style>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<div class="wrap">

  <!-- KOMPAKT BAŞLIK VE AKSİYON ÇUBUĞU -->
  <div class="top-header">
    <div class="title-area">
      <h1>📡 Karkamış · Local Radar</h1>
      <div class="sub">📅 28.10.2026 · <span id="toplamRozet">10 Mekan</span></div>
    </div>
    <div class="header-badges">
      <button class="act-btn" onclick="konumAl(draw)">📍 Yakınımda</button>
      <button class="act-btn" onclick="rotaAc()">🚗 Rota</button>
      <button class="act-btn" onclick="wpListe()">💬 WP</button>
      <button class="act-btn danger" onclick="favorileriTemizle()">🗑️ Sıfırla</button>
    </div>
  </div>

  <!-- KOMPAKT FİLTRE PANELİ -->
  <div class="filter-card">
    <input id="q" type="search" placeholder="🔍 Mekan, yemek veya mahalle ara (örn. pide, kebap, Etiler)...">
    
    <select id="ic" aria-label="İlçe" style="margin-top:6px"></select>

    <div class="f-row-mahalle" id="mahalleKutusu">
      <div>
        <input id="mq" type="search" placeholder="📍 Hızlı mahalle filtrele...">
      </div>
      <div>
        <select id="mh" aria-label="Mahalle"></select>
      </div>
    </div>

    <div class="f-row-compact">
      <div>
        <span class="f-label">En Az Puan</span>
        <input id="mp" type="number" step="0.1" min="0" max="5" placeholder="Örn: 4.2">
      </div>
      <div>
        <span class="f-label">En Az Yorum</span>
        <input id="my" type="number" step="5" min="0" placeholder="Örn: 10">
      </div>
      <div>
        <span class="f-label">Sıralama</span>
        <select id="sirala" aria-label="Sıralama">
          <option value="skor">Güvenilir Skor</option>
          <option value="puan">Puan (Yüksek)</option>
          <option value="yorum">Yorum (Çok)</option>
          <option value="yakin">Bana Yakın</option>
        </select>
      </div>
      <div>
        <span class="f-label">Görünüm</span>
        <select id="gs">
          <option value="">Tümü</option>
          <option value="fav">★ Favoriler</option>
        </select>
      </div>
    </div>
  </div>

  <!-- KATEGORİ SEKMELERİ (HEPSİ GÖRÜNÜR) -->
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="chips" id="chips"></div>

  <!-- HARİTA VE LİSTE -->
  <div id="map"></div>
  <div id="list"></div>

  <p class="foot">
    <b>📡 Local Radar</b> · Google Haritalar verileri · Harita: © OpenStreetMap
  </p>
</div>

<script>
const V={"O": {"Yemek": ["Döner & Kebap", "Çiğ Köfte", "Pide & Lahmacun", "Fast food & Burger & Pizza", "Türk & Aile Restoranı", "Kafe & Kahve", "Kahvaltı", "Fırın & Tatlı", "Kasap"]}, "I": [{"n": "Burhan Usta Lokantasi", "p": "3,8", "y": 12, "u": 0, "s": 3.891, "t": "Et Lokantası", "a": "", "f": "", "m": "Lojmanlar Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Burhan+Usta+Lokantasi/data=!4m7!3m6!1s0x153175eba75b1343:0xd5c188fda289a91c!8m2!3d36.8325844!4d37.9960566!16s%2Fg%2F11f541zbn7!19sChIJQxNbp-t1MRURHKmJov2IwdU", "e": 36.8325844, "b": 37.9960566, "w": 1, "A": "Yemek", "S": "Döner & Kebap"}, {"n": "Ciğercim kebap salonu", "p": "4,0", "y": 3, "u": 0, "s": 4.0, "t": "", "a": "", "f": "", "m": "Lojmanlar Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Ci%C4%9Fercim+kebap+salonu/data=!4m7!3m6!1s0x153175c6b7f6b089:0xb7ef22d493b16274!8m2!3d36.8321818!4d37.9973133!16s%2Fg%2F11frtj7982!19sChIJibD2t8Z1MRURdGKxk9Qi77c", "e": 36.8321818, "b": 37.9973133, "w": 1, "A": "Yemek", "S": "Döner & Kebap"}, {"n": "DENİZ Döner Ve Kebap Salonu", "p": "4,0", "y": 9, "u": 0, "s": 4.0, "t": "Restoran", "a": "Çarşı Atatürk Caddesi köprü başı", "f": "", "m": "Etiler Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/DEN%C4%B0Z+D%C3%B6ner+Ve+Kebap+Salonu/data=!4m7!3m6!1s0x1531752648bc9f6d:0xd6260d1076861d8b!8m2!3d36.8350081!4d38.0002025!16s%2Fg%2F11mtrb0cnm!19sChIJbZ-8SCZ1MRURix2GdhANJtY", "e": 36.8350081, "b": 38.0002025, "w": 1, "A": "Yemek", "S": "Döner & Kebap"}, {"n": "Karkamış Belediye Balıkçısı", "p": "0,0", "y": 0, "u": 1, "s": 0.0, "t": "Balık Restoranı", "a": "", "f": "", "m": "Karşıyaka Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Karkam%C4%B1%C5%9F+Belediye+Bal%C4%B1k%C3%A7%C4%B1s%C4%B1/data=!4m7!3m6!1s0x1531770031098295:0x7d76e95069cf34e7!8m2!3d36.8437636!4d38.0127731!16s%2Fg%2F11z_rkctzj!19sChIJlYIJMQB3MRUR5zTPaVDpdn0", "e": 36.8437636, "b": 38.0127731, "w": 1, "A": "Yemek", "S": "Türk & Aile Restoranı"}, {"n": "Memet Usta Lokantası", "p": "4,4", "y": 63, "u": 0, "s": 4.345, "t": "Türk restoranı", "a": "", "f": "", "m": "Lojmanlar Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Memet+Usta+Lokantas%C4%B1/data=!4m7!3m6!1s0x153175ea675fda1f:0xb7535d70ec374396!8m2!3d36.8320928!4d37.9982127!16s%2Fg%2F11bychm0zq!19sChIJH9pfZ-p1MRURlkM37HBdU7c", "e": 36.8320928, "b": 37.9982127, "w": 1, "A": "Yemek", "S": "Türk & Aile Restoranı"}, {"n": "Seyri Firat Balık Restorant", "p": "0,0", "y": 0, "u": 1, "s": 0.0, "t": "", "a": "", "f": "", "m": "Etiler Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Seyri+Firat+Bal%C4%B1k+Restorant/data=!4m7!3m6!1s0x153175001b8a2817:0x25e527dca87ca33b!8m2!3d36.8357599!4d37.9952166!16s%2Fg%2F11z4fj7nxb!19sChIJFyiKGwB1MRURO6N8qNwn5SU", "e": 36.8357599, "b": 37.9952166, "w": 1, "A": "Yemek", "S": "Türk & Aile Restoranı"}, {"n": "Karkamış pide ve lahmacun fırını", "p": "5,0", "y": 1, "u": 0, "s": 4.091, "t": "Fırın", "a": "Atatürk Cd No:12", "f": "", "m": "Etiler Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Karkam%C4%B1%C5%9F+pide+ve+lahmacun+f%C4%B1r%C4%B1n%C4%B1/data=!4m7!3m6!1s0x1531750079b0198b:0xd79c246f6155998b!8m2!3d36.8329396!4d37.999838!16s%2Fg%2F11ygp8grhr!19sChIJixmweQB1MRURi5lVYW8knNc", "e": 36.8329396, "b": 37.999838, "w": 1, "A": "Yemek", "S": "Pide & Lahmacun"}, {"n": "Yılmaz Pide Fırını", "p": "4,1", "y": 14, "u": 0, "s": 4.058, "t": "", "a": "", "f": "", "m": "Etiler Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/Y%C4%B1lmaz+Pide+F%C4%B1r%C4%B1n%C4%B1/data=!4m7!3m6!1s0x153175c1fcf32a03:0x1602b36109eaebb1!8m2!3d36.832968!4d37.999887!16s%2Fg%2F11b7q54ywy!19sChIJAyrz_MF1MRURsevqCWGzAhY", "e": 36.832968, "b": 37.999887, "w": 1, "A": "Yemek", "S": "Pide & Lahmacun"}, {"n": "FIRAT CAFETERYA", "p": "4,0", "y": 1, "u": 0, "s": 4.0, "t": "Kahve dükkanı", "a": "", "f": "", "m": "Karşıyaka Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/FIRAT+CAFETERYA/data=!4m7!3m6!1s0x153175006deb7ec9:0x1b187a4da9649428!8m2!3d36.8418181!4d38.01322!16s%2Fg%2F11npcqz_l_!19sChIJyX7rbQB1MRURKJRkqU16GBs", "e": 36.8418181, "b": 38.01322, "w": 1, "A": "Yemek", "S": "Kafe & Kahve"}, {"n": "THAILAND CAFE", "p": "5,0", "y": 8, "u": 0, "s": 4.444, "t": "Kahve dükkanı", "a": "", "f": "", "m": "Karşıyaka Mahallesi", "c": "Karkamış", "l": "https://www.google.com/maps/place/THAILAND+CAFE/data=!4m7!3m6!1s0x153175003be578b9:0xccb18b58c980e6c5!8m2!3d36.8370116!4d38.0014134!16s%2Fg%2F11xg__t5gq!19sChIJuXjlOwB1MRURxeaAyViLscw", "e": 36.8370116, "b": 38.0014134, "w": 1, "A": "Yemek", "S": "Kafe & Kahve"}]};
const O=V.O,I=V.I,ANA=Object.keys(O);let ana='',alt='',map=null,katman=null;
const HARITA='__MAP__';
const RENK={'Yemek':'#e8710a','Gezilecek yerler':'#2563eb','Alışveriş':'#059669','Diğer':'#64748b'};
const IKONLAR={
  'Döner & Kebap':'🥩',
  'Çiğ Köfte':'🌶️',
  'Pide & Lahmacun':'🫓',
  'Fast food & Burger & Pizza':'🍔',
  'Türk & Aile Restoranı':'🍲',
  'Kafe & Kahve':'☕',
  'Kahvaltı':'🥐',
  'Fırın & Tatlı':'🥮',
  'Kasap':'🔪'
};

const $=id=>document.getElementById(id);
const tabs=$('tabs'),chips=$('chips'),list=$('list'),q=$('q'),mh=$('mh'),mq=$('mq'),ic=$('ic'),mp=$('mp'),my=$('my'),sirala=$('sirala'),gs=$('gs'),mapEl=$('map');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tl=s=>String(s).toLocaleLowerCase('tr');

function durumOku(){try{return JSON.parse(localStorage.getItem('gezi_durum')||'{}')}catch(e){return {}}}
function durumYaz(){try{localStorage.setItem('gezi_durum',JSON.stringify(durum))}catch(e){}}
let durum=durumOku();
let konum=null;

function km(a,b,c,d){const t=x=>x*Math.PI/180,R=6371,dl=t(c-a),dg=t(d-b);
  const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function uzak(x){return(konum&&x.e!=null)?km(konum.lat,konum.lon,x.e,x.b):null}

function konumAl(sonra){
  if(!navigator.geolocation){alert('Bu tarayıcı konum vermiyor');return;}
  navigator.geolocation.getCurrentPosition(
    p=>{konum={lat:p.coords.latitude,lon:p.coords.longitude};if(sonra)sonra();},
    ()=>alert('Konum alınamadı. Tarayıcıda konum iznini aç.'),
    {enableHighAccuracy:true,timeout:10000});
}

const ilceler=[...new Set(I.map(x=>x.c).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
if(ilceler.length>=2)ic.innerHTML='<option value="">Tüm ilçeler</option>'+ilceler.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
else ic.style.display='none';

const mahSayisi=new Set(I.filter(x=>x.m!=='Bilinmiyor').map(x=>x.c+'|'+x.m)).size;
if(mahSayisi<2){$('mahalleKutusu').style.display='none'}

function mahalleListe(){
  if(mahSayisi<2)return;
  const c=ic.value,t=tl(mq.value.trim()),say={};
  I.forEach(x=>{if((c&&x.c!==c)||x.m==='Bilinmiyor')return;const k=x.c+'|'+x.m;say[k]=(say[k]||0)+1});
  const ks=Object.keys(say).filter(k=>tl(k.split('|')[1]).includes(t)).sort((a,b)=>a.split('|')[1].localeCompare(b.split('|')[1],'tr'));
  const onceki=mh.value;
  mh.innerHTML='<option value="">Tüm mahalleler</option>'+ks.map(k=>{const p=k.split('|');
    return `<option value="${esc(k)}">${esc(p[1])}${(!c&&p[0])?' · '+esc(p[0]):''} (${say[k]})</option>`}).join('');
  if(ks.includes(onceki))mh.value=onceki;
}

function ok(x){
  const t=tl(q.value.trim()),p0=parseFloat(mp.value)||0,y0=parseInt(my.value,10)||0;
  return (!ic.value||x.c===ic.value)&&(!mh.value||(x.c+'|'+x.m)===mh.value)&&
    (!t||tl(x.n+' '+x.t+' '+x.m).includes(t))&&(p0===0&&y0===0&&x.u ? true : (parseFloat(x.p.replace(',','.'))>=p0&&(x.y||0)>=y0))&&
    (gs.value===''||(gs.value==='fav'&&(durum[x.l]||{}).fav));
}

function kiyas(a,b){
  const s=sirala.value;
  if(s==='puan')return parseFloat(b.p.replace(',','.'))-parseFloat(a.p.replace(',','.'));
  if(s==='yorum')return b.y-a.y;
  if(s==='yakin'){ if(!konum){konumAl(draw);return 0;} return (uzak(a)??1e9)-(uzak(b)??1e9); }
  return b.s-a.s;
}

function haritaCiz(){
  list.style.display='none';mapEl.style.display='block';
  if(!map){
    map=L.map('map');
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap katkıcıları'}).addTo(map);
  }
  setTimeout(()=>map.invalidateSize(),60);
  if(katman)map.removeLayer(katman);
  const pts=I.filter(x=>ok(x)&&typeof x.e==='number'&&typeof x.b==='number');
  const isaretler=pts.map(x=>L.circleMarker([x.e,x.b],{radius:8,weight:2,color:'#fff',fillColor:RENK[x.A]||'#2563eb',fillOpacity:.95})
    .bindPopup('<b>'+esc(x.n)+'</b><br>⭐ '+(x.u?'Puansız':esc(x.p)+' ('+x.y+' yorum)')+'<br>📍 '+esc(x.m!=='Bilinmiyor'?x.m:'')+
      '<br><a href="'+esc(x.l)+'" target="_blank" rel="noopener">Google Haritalar\u2019da aç ↗</a>'));
  katman=L.featureGroup(isaretler).addTo(map);
  if(pts.length)map.fitBounds(katman.getBounds().pad(0.15));
  else map.setView([36.835,38.000],14);
}

function puanSinifi(x){
  if(x.u) return 'tier-none';
  const p = parseFloat(x.p.replace(',','.'));
  if(p >= 4.5) return 'tier-high';
  if(p >= 4.0) return 'tier-mid';
  return 'tier-low';
}

function satir(x){
  const fDurum=durum[x.l]||{};
  const tier=puanSinifi(x);
  const puanKutusu=x.u
    ? '<b style="font-size:11px">Yeni</b><small>—</small>'
    : `<b>★${x.p}</b><small>${x.y} oy</small>`;

  const parcalar=[];
  if(x.t) parcalar.push(`<span class="tag">${esc(x.t)}</span>`);
  if(x.m && x.m!=='Bilinmiyor') parcalar.push(`<span class="tag mah-tag">📍 ${esc(x.m.replace(' Mahallesi',''))}${(ilceler.length>=2&&x.c)?' · '+esc(x.c):''}</span>`);
  if(x.f) parcalar.push(`<span class="tag fy-tag">💳 ${esc(x.f)}</span>`);
  if(uzak(x)!=null) parcalar.push(`<span class="tag dist-tag">🧭 ${uzak(x).toFixed(1).replace('.',',')} km</span>`);
  if(x.a) parcalar.push(`<span>${esc(x.a)}</span>`);

  return `<div class="row">
    <div class="pt ${tier}">${puanKutusu}</div>
    <div class="body">
      <div class="nm">${esc(x.n)}</div>
      ${parcalar.length ? `<div class="meta-line">${parcalar.join('')}</div>` : ''}
    </div>
    <div class="side-actions">
      <button class="ikon ${fDurum.fav?'fav-active':''}" data-t="fav" data-l="${esc(x.l)}" title="Favorilere ekle">
        ${fDurum.fav?'★':'☆'}
      </button>
      <a class="go" href="${esc(x.l)}" target="_blank" rel="noopener">Harita<span class="go-txt">da Aç</span> ↗</a>
    </div>
  </div>`;
}

function rotaAc(){
  const d=I.filter(x=>(durum[x.l]||{}).fav&&x.e!=null);
  if(!d.length){alert('Önce mekanları "☆" butonuyla favorilere ekleyin.');return;}
  const son=d[d.length-1], ara=d.slice(0,-1).map(x=>x.e+','+x.b).join('|');
  let url='https://www.google.com/maps/dir/?api=1&destination='+son.e+','+son.b+'&travelmode=driving';
  if(ara) url+='&waypoints='+encodeURIComponent(ara);
  window.open(url,'_blank');
}

function wpListe(){
  const l=I.filter(ok).slice(0,10).filter(x=>x.e!=null);
  if(!l.length){alert('Listede konumlu mekan yok.');return;}
  const t=l.map((x,i)=>`${i+1}. ${x.n} (${x.u?'Puansız':x.p+'★, '+x.y+' yorum'})${x.m!=='Bilinmiyor'?' - '+x.m:''}\nhttps://maps.google.com/?q=${x.e},${x.b}`).join('\n\n');
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}

function favorileriTemizle(){
  ic.value='';mq.value='';mahalleListe();mh.value='';
  mp.value='';my.value='';q.value='';
  sirala.value='skor';gs.value='';ana='';alt='';
  draw();scrollTo({top:0,behavior:'smooth'});
  if(Object.keys(durum).length&&confirm('Kayıtlı favorileriniz de silinsin mi?')){
    localStorage.removeItem('gezi_durum');
    durum={};
    draw();
  }
}

list.addEventListener('click',e=>{
  const b=e.target.closest('.ikon'); if(!b) return;
  const l=b.dataset.l; if(!l) return;
  durum[l]=durum[l]||{};
  if(b.dataset.t==='fav') durum[l].fav=!durum[l].fav;
  durumYaz(); draw();
});

function draw(){
  if(ana===HARITA){haritaCiz();}
  else{mapEl.style.display='none';list.style.display='';}
  const f=I.filter(ok),arama=q.value.trim()!=='';
  $('toplamRozet').textContent = `${f.length} Mekan`;

  const cnt={};f.forEach(x=>{cnt[x.A]=(cnt[x.A]||0)+1});
  const TEK=ANA.length===1;
  if(TEK){
    const a0=ANA[0],c3={};f.forEach(x=>{c3[x.S]=(c3[x.S]||0)+1});
    tabs.innerHTML=`<button role="tab" aria-selected="${ana===''}" data-a="">✨ Tümü (${f.length})</button>`+
      O[a0].filter(s=>c3[s]).map(s=>`<button role="tab" aria-selected="${ana===a0&&alt===s}" data-a="${esc(a0)}" data-s="${esc(s)}">${IKONLAR[s]||'🍽️'} ${esc(s)} (${c3[s]})</button>`).join('')+
      `<button role="tab" aria-selected="${ana===HARITA}" data-a="${HARITA}">🗺️ Harita</button>`;
  }else tabs.innerHTML=`<button role="tab" aria-selected="${ana===''}" data-a="">✨ Tümü (${f.length})</button>`+
    ANA.map(a=>`<button role="tab" aria-selected="${ana===a}" data-a="${esc(a)}">${esc(a)} (${cnt[a]||0})</button>`).join('')+
    `<button role="tab" aria-selected="${ana===HARITA}" data-a="${HARITA}">🗺️ Harita</button>`;

  if(!TEK&&ana&&ana!==HARITA){
    const c2={};f.filter(x=>x.A===ana).forEach(x=>{c2[x.S]=(c2[x.S]||0)+1});
    chips.innerHTML=`<button aria-pressed="${alt===''}" data-s="">Hepsi</button>`+
      O[ana].filter(s=>c2[s]).map(s=>`<button aria-pressed="${alt===s}" data-s="${esc(s)}">${IKONLAR[s]||''} ${esc(s)} (${c2[s]})</button>`).join('');
    chips.style.display='';
  }else chips.style.display='none';

  if(ana===HARITA)return;

  const sec=f.filter(x=>arama||!ana||(x.A===ana&&(!alt||x.S===alt)));
  const tumu=arama||!ana;let out='';

  ANA.forEach(a=>O[a].forEach(s=>{
    const it=sec.filter(x=>x.A===a&&x.S===s);if(!it.length)return;
    it.sort(kiyas);
    const ikon = IKONLAR[s] || '🍽️';
    const bas = tumu ? `${ikon} ${s}` : (alt ? '' : `${ikon} ${s}`);
    out += (bas ? `<h2>${bas} <span class="count-pill">${it.length}</span></h2>` : '') +
           `<div class="cards-group">${it.map(satir).join('')}</div>`;
  }));
  list.innerHTML=out||'<div class="none">🔍 Aradığınız ölçütlere uygun mekan bulunamadı.</div>';
}

tabs.onclick=e=>{const b=e.target.closest('button');if(b){ana=b.dataset.a;alt=b.dataset.s||'';draw();}};
chips.onclick=e=>{const b=e.target.closest('button');if(b){alt=b.dataset.s;draw()}};
ic.onchange=()=>{mahalleListe();draw()};
mq.oninput=()=>{mahalleListe();draw()};
mh.onchange=draw;
mp.oninput=draw;
my.oninput=draw;
q.oninput=draw;
gs.onchange=draw;
sirala.onchange=draw;

mahalleListe();
draw();
</script>
</body>
</html>
