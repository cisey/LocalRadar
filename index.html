    function normalize(str) {
      return String(str)
        .toLocaleLowerCase('tr')
        .replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
        .replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c')
        .replace(/İ/g, 'i').replace(/[^a-z0-9]/g, '');
    }
    function basHarfBuyut(s) {
      return s.replace(/\b\p{L}/gu, c => c.toLocaleUpperCase('tr'));
    }

    const ilceIlSozlugu = {};   // ilçe (normalize) -> il
    const ilSozlugu = new Map(); // il (normalize) -> il adı
    const ilceAdlari = {};      // il -> Map(ilçe normalize -> düzgün yazılışı)

    // Gaziantep en sona işlenir: aynı isimli ilçelerde Gaziantep öncelikli olur.
    const ilSirasi = Object.keys(ilIlceData).filter(i => i !== 'Gaziantep').concat('Gaziantep');
    for (const il of ilSirasi) {
      ilSozlugu.set(normalize(il), il);
      ilceAdlari[il] = new Map();
      ilIlceData[il].split(',').forEach(ilce => {
        const n = normalize(ilce);
        ilceAdlari[il].set(n, ilce);
        if (n === 'merkez') return; // "Merkez" tek başına il belirlemez
        ilceIlSozlugu[n] = il;
      });
    }

    function dosyaAnaliz(dosyaAdi) {
      const ad = dosyaAdi.replace(/\.html?$/i, '');
      const bolge = ad.replace(/-(yemek|hersey|her-sey)$/i, '');
      let kelimeler = bolge.split(/[-_ ]+/).filter(Boolean);
      const isTum = /(^|[-_ ])tum[-_ ]?ilceler$/i.test(bolge);

      let il = 'Diğer';
      for (const k of kelimeler) {
        const n = normalize(k);
        if (ilSozlugu.has(n)) { il = ilSozlugu.get(n); break; }
        if (ilceIlSozlugu[n]) { il = ilceIlSozlugu[n]; break; }
      }

      let label = '';
      if (!isTum) {
        let kalan = kelimeler.slice();
        if (kalan.length > 1 && ilSozlugu.has(normalize(kalan[0]))) kalan = kalan.slice(1); // il öneki
        const ham = kalan.join(' ');
        const nHam = normalize(ham);
        if (il !== 'Diğer' && nHam === normalize(il)) {
          label = 'Merkez';
        } else if (il !== 'Diğer' && ilceAdlari[il].has(nHam)) {
          label = ilceAdlari[il].get(nHam);
        } else {
          label = basHarfBuyut(ham);
        }
      }
      return { il, label, dosya: dosyaAdi, tum: isTum };
    }

    function yolu(dosya) { return encodeURI(KLASOR + dosya); }

    function ciz(sorgu) {
      const qn = normalize(sorgu || '');
      container.innerHTML = '';

      const gruplar = {};
      tumRehberler.map(dosyaAnaliz).forEach(i => (gruplar[i.il] = gruplar[i.il] || []).push(i));
      const iller = Object.keys(gruplar).sort((a, b) => {
        if (a === 'Diğer') return 1;
        if (b === 'Diğer') return -1;
        return a.localeCompare(b, 'tr');
      });

      let goruntulenen = 0;
      iller.forEach(il => {
        const tumu = gruplar[il].find(i => i.tum);
        let ilceler = gruplar[il].filter(i => !i.tum)
          .sort((a, b) => a.label.localeCompare(b.label, 'tr'));

        if (qn) {
          const ilEslesti = normalize(il).includes(qn);
          if (!ilEslesti) {
            ilceler = ilceler.filter(c => normalize(c.label).includes(qn) || normalize(c.dosya).includes(qn));
            if (!ilceler.length) return;
          }
        }
        goruntulenen++;

        const d = document.createElement('details');
        d.className = 'il';
        if (qn) d.open = true;

        const s = document.createElement('summary');
        const ad = document.createElement('span');
        ad.textContent = il;
        const nIlce = gruplar[il].filter(i => !i.tum).length;
        const nMekan = (tumu && ozet[tumu.dosya]) ? ozet[tumu.dosya] : gruplar[il].reduce((t, i) => t + (i.tum ? 0 : (ozet[i.dosya] || 0)), 0);
        if (nMekan) {
          const oz = document.createElement('small');
          oz.className = 'ozet';
          oz.textContent = (nIlce ? nIlce + ' ilçe · ' : '') + nMekan.toLocaleString('tr-TR') + ' mekan';
          ad.appendChild(oz);
        }
        const ch = document.createElement('span');
        ch.className = 'chev'; ch.textContent = '›';
        s.append(ad, ch);
        d.appendChild(s);

        const ic = document.createElement('div');
        ic.className = 'il-ic';

        if (tumu) {
          const a = document.createElement('a');
          a.className = 'tum-btn';
          a.href = yolu(tumu.dosya);
          const t = document.createElement('span');
          t.textContent = '📚  ' + (il === 'Diğer' ? '' : il + ' · ') + 'Tüm İlçeler';
          const o = document.createElement('span');
          o.className = 'ok'; o.textContent = '→';
          a.append(t, o);
          ic.appendChild(a);
        }

        if (ilceler.length) {
          if (tumu) {
            const b = document.createElement('div');
            b.className = 'alt-baslik';
            b.textContent = 'İlçeler';
            ic.appendChild(b);
          }
          const chips = document.createElement('div');
          chips.className = 'chips';
          ilceler.forEach(i => {
            const a = document.createElement('a');
            a.className = 'chip';
            a.href = yolu(i.dosya);
            a.textContent = i.label;
            chips.appendChild(a);
          });
          ic.appendChild(chips);
        }

        d.appendChild(ic);
        container.appendChild(d);
      });

      if (!goruntulenen) {
        container.innerHTML = '<div class="state-msg">Eşleşen rehber bulunamadı.</div>';
      }
    }

    searchInput.addEventListener('input', e => ciz(e.target.value));

    function listeyiYukle(dosyalar) {
      tumRehberler = dosyalar
        .filter(f => /\.html?$/i.test(f) && !/^index\.html?$/i.test(f))
        .sort((a, b) => a.localeCompare(b, 'tr'));
      ciz('');
    }

    // Rehber başına mekan sayısı (ozet.json, GitHub Actions üretir; yoksa özet gösterilmez)
    let ozet = {};
    fetch('ozet.json', { cache: 'no-cache' })
      .then(r => r.ok ? r.json() : {})
      .then(o => { ozet = o || {}; if (tumRehberler.length) ciz(searchInput.value); })
      .catch(() => {});

    // 1) rehberler.json (GitHub Actions üretir)  2) olmazsa GitHub API
    fetch('rehberler.json', { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error('json yok'); return r.json(); })
      .then(data => {
        const dosyalar = Array.isArray(data)
          ? data.map(x => typeof x === 'string' ? x : (x.file || x.name))
          : (data && Array.isArray(data.files) ? data.files : Object.keys(data || {}));
        listeyiYukle(dosyalar.filter(Boolean));
      })
      .catch(() => {
        fetch('https://api.github.com/repos/cisey/LocalRadar/contents/rehberler')
          .then(r => { if (!r.ok) throw new Error('api hata'); return r.json(); })
          .then(dosyalar => listeyiYukle(dosyalar.map(f => f.name)))
          .catch(() => {
            container.innerHTML = '<div class="state-msg">Rehber listesi yüklenemedi.</div>';
          });
      });
  </script>
</body>
</html>
