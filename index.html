<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalRadar - Yerel Rehberler</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto}
header{text-align:center;padding:30px 0;border-bottom:1px solid #1e293b;margin-bottom:30px}
h1{font-size:2rem;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.subtitle{color:#94a3b8;font-size:.95rem}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;justify-content:center}
select,input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:10px 14px;border-radius:8px;font-size:.9rem;outline:none;transition:.2s}
select:focus,input:focus{border-color:#38bdf8}
input{min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#1e293b;border-radius:12px;padding:20px;border:1px solid #334155;transition:.25s;cursor:pointer;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);border-color:#38bdf8;box-shadow:0 8px 24px rgba(56,189,248,.15)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#38bdf8,#818cf8)}
.card h3{font-size:1.1rem;margin-bottom:10px;color:#f1f5f9}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:.8rem}
.badge{background:#0f172a;color:#38bdf8;padding:4px 10px;border-radius:20px;border:1px solid #334155}
.badge.cat{color:#a78bfa}
.empty{text-align:center;padding:60px 20px;color:#64748b}
.empty svg{width:60px;height:60px;margin-bottom:16px;opacity:.5}
.count{text-align:center;color:#64748b;font-size:.85rem;margin-bottom:20px}
footer{text-align:center;padding:30px 0;color:#475569;font-size:.8rem;border-top:1px solid #1e293b;margin-top:40px}
footer a{color:#38bdf8;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<header>
<h1>📡 LocalRadar</h1>
<p class="subtitle">Yerel mekan rehberleriniz</p>
</header>

<div class="filters">
<select id="ilFilter"><option value="">Tüm İller</option></select>
<select id="ilceFilter"><option value="">Tüm İlçeler</option></select>
<select id="kategoriFilter"><option value="">Tüm Kategoriler</option></select>
<input type="text" id="searchInput" placeholder="🔍 Rehber ara...">
</div>

<div class="count" id="count"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
<svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
<p>Sonuç bulunamadı</p>
</div>

<footer>LocalRadar &copy; 2025 &middot; <a href="https://github.com/cisey/LocalRadar" target="_blank">GitHub</a></footer>
</div>

<script>
// ===== MANUEL DOSYA LİSTESİ =====
// Yeni rehber eklediğinizde buraya bir satır ekleyin
const MANUEL_DOSYA_LISTESI = [
  "Islahiye.html",
  "Karkamis.html"
  // "YeniIlce.html",
];

// ===== İL/İLÇE/KATEGORİ VERİSİ =====
const ilIlceData = {
  "Islahiye": { il: "Gaziantep", ilce: "İslahiye", kategori: "Yemek" },
  "Karkamis": { il: "Gaziantep", ilce: "Karkamış", kategori: "Yemek" },
  // "YeniIlce": { il: "İl", ilce: "İlçe", kategori: "Kategori" },
};

// ===== DOSYA ADINDAN BİLGİ ÇIKARIMI =====
function dosyaBilgisiCikar(dosyaAdi) {
  const temelAd = dosyaAdi.replace(/\.html$/i, "");

  // 1) Önce ilIlceData sözlüğünde ara (tam eşleşme)
  if (ilIlceData[temelAd]) {
    return {
      dosya: dosyaAdi,
      baslik: temelAd,
      il: ilIlceData[temelAd].il || "",
      ilce: ilIlceData[temelAd].ilce || temelAd,
      kategori: ilIlceData[temelAd].kategori || ""
    };
  }

  // 2) Sözlükte yoksa: eski kalıpları dene (Ilce_guide, Yemek-Ilce_guide vb.)
  let ad = temelAd.replace(/_guide$/i, "");
  let kategori = "";
  let ilce = ad;

  const dashIdx = ad.indexOf("-");
  if (dashIdx > 0) {
    kategori = ad.substring(0, dashIdx);
    ilce = ad.substring(dashIdx + 1);
  }

  // ilIlceData içinde ilçe adına göre de ara
  for (const key in ilIlceData) {
    if (key.toLowerCase() === ilce.toLowerCase()) {
      const d = ilIlceData[key];
      return {
        dosya: dosyaAdi,
        baslik: key,
        il: d.il || "",
        ilce: d.ilce || key,
        kategori: d.kategori || kategori
      };
    }
  }

  return {
    dosya: dosyaAdi,
    baslik: ilce || temelAd,
    il: "",
    ilce: ilce || temelAd,
    kategori: kategori
  };
}

// ===== REHBERLERİ OLUŞTUR =====
const rehberler = MANUEL_DOSYA_LISTESI.map(dosyaBilgisiCikar);

// ===== FİLTRE SEÇENEKLERİNİ DOLDUR =====
function benzersizDegerler(alan) {
  return [...new Set(rehberler.map(r => r[alan]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
}

const ilSelect = document.getElementById('ilFilter');
const ilceSelect = document.getElementById('ilceFilter');
const kategoriSelect = document.getElementById('kategoriFilter');

benzersizDegerler('il').forEach(v => {
  const o = document.createElement('option'); o.value = v; o.textContent = v; ilSelect.appendChild(o);
});
benzersizDegerler('ilce').forEach(v => {
  const o = document.createElement('option'); o.value = v; o.textContent = v; ilceSelect.appendChild(o);
});
benzersizDegerler('kategori').forEach(v => {
  const o = document.createElement('option'); o.value = v; o.textContent = v; kategoriSelect.appendChild(o);
});

// ===== RENDER =====
const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const countEl = document.getElementById('count');
const searchInput = document.getElementById('searchInput');

function render() {
  const il = ilSelect.value;
  const ilce = ilceSelect.value;
  const kategori = kategoriSelect.value;
  const q = searchInput.value.trim().toLowerCase();

  const filtreli = rehberler.filter(r => {
    if (il && r.il !== il) return false;
    if (ilce && r.ilce !== ilce) return false;
    if (kategori && r.kategori !== kategori) return false;
    if (q) {
      const haystack = (r.baslik + " " + r.il + " " + r.ilce + " " + r.kategori).toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  grid.innerHTML = "";
  countEl.textContent = filtreli.length + " rehber gösteriliyor";

  if (filtreli.length === 0) {
    empty.style.display = "block";
    grid.style.display = "none";
    return;
  }
  empty.style.display = "none";
  grid.style.display = "grid";

  filtreli.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>📍 ${escapeHtml(r.baslik)}</h3>
      <div class="meta">
        ${r.il ? `<span class="badge">${escapeHtml(r.il)}</span>` : ""}
        ${r.ilce ? `<span class="badge">${escapeHtml(r.ilce)}</span>` : ""}
        ${r.kategori ? `<span class="badge cat">${escapeHtml(r.kategori)}</span>` : ""}
      </div>
    `;
    card.addEventListener('click', () => {
      window.location.href = encodeURIComponent(r.dosya);
    });
    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

ilSelect.addEventListener('change', render);
ilceSelect.addEventListener('change', render);
kategoriSelect.addEventListener('change', render);
searchInput.addEventListener('input', render);

render();
</script>
</body>
</html>
